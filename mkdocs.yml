site_name: Sabaku's Deltarune Wiki
theme:
  name: simple-blog
markdown_extensions:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.caret
  - footnotes 
  - abbr
  - attr_list
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
watch:
  - includes
extra:
  generator: false
extra_css:
  - style.css
extra_javascript:
  - javascript.js

nav:
  - 'Home': index.md
  - 'Plot Principale (CH1+CH2)': plot.md
  - 'Superboss (CH1+CH2)': superboss.md
  - 'Diventare Piu' Forti (WR CH2)': becomestronger.md
  - 'I Dettagli (CH1+CH2)': dettagli.md
  - 'Le Chicche (CH3+CH4)': chicche_ch3-4.md
  - 'Preparazione al Capitolo 5': Chapter5_prep.md
  - 'Crediti': credits.md

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    unrecognized_links: warn

plugins:
  - glightbox
